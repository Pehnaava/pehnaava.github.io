/* ---------- layout ---------- */
function draw(){$('#nav').innerHTML='<h2>PEHNAAVA</h2>'+TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');badge();const m=$('#main');({dash,prod,cats:()=>lst('cats','Categories','The “Shop by Category” tiles on the homepage.',[[0,'Name'],[1,'Image URL','img']],()=>['New Category','']),hero:()=>lst('hero','Hero banners','Homepage slider. Each slide has its own text, button and photo.',[['label','Label'],['title','Title (HTML allowed, e.g. <em>word</em>)'],['text','Text'],['btn','Button text'],['filter','Button filter (All, Wedding, Festive…)'],['img','Image URL','img']],()=>({label:'New Collection',title:'New <em>Banner.</em>',text:'Describe it here.',btn:'Shop Now',filter:'All',img:''})),nav:()=>lst('nav','Navigation menu','Desktop and mobile menu share these links (use #new, #festive, #bestsellers or any URL).',[[0,'Label'],[1,'Link']],()=>['New Link','#new']),look,prev,set}[tab]||dash)(m)}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}};
const head=(t,s,btn='')=>`<div class="row"><div><h1 class="t">${t}</h1><p style="color:var(--mut)">${s}</p></div><div class="sp" style="flex:1"></div>${btn}</div>`;
function dash(m){const pr=D.products,l=ld(K.log,[]);m.innerHTML=head('Dashboard','Overview of your storefront')+`<div class="cards"><div class="card"><b>${pr.length}</b><span>Total products</span></div><div class="card"><b>${pr.filter(p=>!p.hidden).length}</b><span>Visible products</span></div><div class="card"><b>${D.cats.length}</b><span>Categories</span></div><div class="card"><b>${D.hero.length}</b><span>Hero banners</span></div><div class="card"><b>${SECS.length-D.hidden.length}/${SECS.length}</b><span>Sections shown</span></div></div>
<div class="card"><h3>Quick actions</h3><div class="row" style="margin-top:12px"><button class="btn w" data-go="prod" data-add>+ Add product</button><button class="btn g" data-go="hero">Edit banners</button><button class="btn g" data-go="look">Colours & sections</button><button class="btn g" data-go="prev">Publish</button></div></div>
<div class="card"><h3>Recent changes</h3><ul class="log" style="margin-top:12px">${l.length?l.slice(0,8).map(x=>`<li><b style="color:var(--ink)">${esc(x.m)}</b> · ${esc(x.t)}</li>`).join(''):'<li>No changes yet.</li>'}</ul></div>`;
 m.onclick=e=>{const b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;draw();if(b.hasAttribute('data-add'))pf()}}}
/* ---------- products ---------- */
function prod(m){const list=D.products.map((p,i)=>[p,i]).filter(([p])=>!q||(p.name+p.cat+(p.badge||'')).toLowerCase().includes(q));
 m.innerHTML=head('Products',D.products.length+' products · edit, hide, reorder or delete','<button class="btn w" id="addp">+ Add product</button>')+`<div class="wrapx"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Badge</th><th>Visible</th><th></th></tr>${list.map(([p,i])=>`<tr><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>₹${p.price} <s style="color:var(--mut)">₹${p.mrp}</s></td><td>${esc(p.badge||'—')}</td><td><input type="checkbox" style="width:auto" data-vis="${i}" ${p.hidden?'':'checked'}></td><td class="row" style="flex-wrap:nowrap"><button class="btn g s" data-mv="${i}|-1">↑</button><button class="btn g s" data-mv="${i}|1">↓</button><button class="btn g s" data-ed="${i}">Edit</button><button class="btn d s" data-del="${i}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No products found.</td></tr>'}</table></div>`;
 $('#addp').onclick=()=>pf();
 m.onclick=e=>{const t=e.target;if(t.dataset.ed!=null)pf(+t.dataset.ed);if(t.dataset.del!=null){const p=D.products[+t.dataset.del];if(confirm('Delete “'+p.name+'”? It will disappear from the website after you publish.')){D.products.splice(+t.dataset.del,1);touch('Deleted product '+p.name);draw()}}
  if(t.dataset.mv){const[a,d]=t.dataset.mv.split('|').map(Number),b=a+d;if(b>=0&&b<D.products.length){[D.products[a],D.products[b]]=[D.products[b],D.products[a]];touch('Reordered products');draw()}}
  if(t.dataset.vis!=null){const p=D.products[+t.dataset.vis];p.hidden=!t.checked;touch((p.hidden?'Hid ':'Showed ')+p.name)}}}
function pf(i){const n=i==null,p=n?{id:Math.max(0,...D.products.map(x=>x.id))+1,name:'',cat:D.cats[0]?D.cats[0][0]:'Kurta Sets',tags:['Casual'],price:999,mrp:1499,rating:4.5,count:0,badge:'New',colors:[['Ivory','#f1e9dc']],img:'',alt:'',gallery:[],fabric:'',care:'',desc:''}:{...D.products[i]};
 const f=(id,l,v,t='text')=>`<div class="f"><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
 const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h2>${n?'Add product':'Edit product'}</h2><div class="grid2">${f('f_name','Name',p.name)}<div class="f"><label>Category</label><input id="f_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(D.products.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div>${f('f_price','Sale price (₹)',p.price,'number')}${f('f_mrp','MRP (₹)',p.mrp,'number')}${f('f_badge','Badge (New, Bestseller, blank for none)',p.badge||'')}${f('f_tags','Tags (comma separated)',p.tags.join(', '))}</div>
 ${f('f_img','Main image URL',p.img)}${f('f_alt','Hover image URL',p.alt)}<div class="f"><label>More gallery images (one URL per line)</label><textarea id="f_gal">${esc((p.gallery||[]).join('\n'))}</textarea></div>${f('f_col','Colours (Name:#hex, comma separated)',p.colors.map(c=>c[0]+':'+c[1]).join(', '))}${f('f_fab','Fabric',p.fabric)}${f('f_care','Care',p.care)}<div class="f"><label>Description</label><textarea id="f_desc">${esc(p.desc)}</textarea></div><label class="sw"><input type="checkbox" id="f_vis" ${p.hidden?'':'checked'}> Visible on website</label><p id="f_err" style="color:var(--err)"></p><div class="row"><button class="btn g" id="f_x">Cancel</button><div class="sp" style="flex:1"></div><button class="btn w" id="f_ok">Save product</button></div></div>`;document.body.appendChild(bg);
 $('#f_x').onclick=()=>bg.remove();$('#f_ok').onclick=()=>{const v=id=>$('#'+id).value.trim(),price=+v('f_price'),mrp=+v('f_mrp');if(!v('f_name')||!(price>0)||!v('f_img')){$('#f_err').textContent='Name, a price above 0 and a main image URL are required.';return}
  const o={...p,name:v('f_name'),cat:v('f_cat')||'Uncategorised',price,mrp:Math.max(mrp,price),badge:v('f_badge')||null,tags:v('f_tags').split(',').map(s=>s.trim()).filter(Boolean),img:v('f_img'),alt:v('f_alt')||v('f_img'),gallery:[v('f_img'),...$('#f_gal').value.split('\n').map(s=>s.trim()).filter(Boolean)],colors:v('f_col').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split(':');return[a.trim(),(b||'#cccccc').trim()]}),fabric:v('f_fab'),care:v('f_care'),desc:$('#f_desc').value.trim(),hidden:!$('#f_vis').checked};if(!o.colors.length)o.colors=[['Default','#cccccc']];
  if(n)D.products.unshift(o);else D.products[i]=o;touch((n?'Added product ':'Edited product ')+o.name);bg.remove();draw()}}
/* ---------- generic list editor (categories, hero, nav) ---------- */
function lst(key,title,sub,fields,mk){const m=$('#main');m.innerHTML=head(title,sub,'<button class="btn w" id="addi">+ Add</button>')+D[key].map((it,i)=>`<div class="item"><div class="grid2">${fields.map(([k,l,ty])=>`<div class="f"><label>${l}</label><input data-l="${key}|${i}|${k}" value="${esc(it[k])}"></div>`).join('')}</div>${fields.some(f=>f[2]==='img')&&it[fields.find(f=>f[2]==='img')[0]]?`<img src="${esc(it[fields.find(f=>f[2]==='img')[0]])}" style="height:70px;border-radius:6px;object-fit:cover" alt="">`:''}<div class="row"><button class="btn g s" data-m="${key}|${i}|-1">↑ Up</button><button class="btn g s" data-m="${key}|${i}|1">↓ Down</button><button class="btn d s" data-x="${key}|${i}">Delete</button></div></div>`).join('')||'<div class="card">Nothing here yet.</div>';
 $('#addi').onclick=()=>{D[key].push(mk());touch('Added item to '+title);draw()};
 m.onchange=e=>{const t=e.target;if(t.dataset.l){const[k,i,f]=t.dataset.l.split('|');D[k][+i][f]=t.value;touch('Edited '+title)}};
 m.onclick=e=>{const t=e.target;if(t.dataset.x){const[k,i]=t.dataset.x.split('|');if(confirm('Delete this item? It disappears from the website after you publish.')){D[k].splice(+i,1);touch('Deleted item from '+title);draw()}}
  if(t.dataset.m){const[k,i,d]=t.dataset.m.split('|'),a=+i,b=a+ +d;if(b>=0&&b<D[k].length){[D[k][a],D[k][b]]=[D[k][b],D[k][a]];touch('Reordered '+title);draw()}}}}
/* ---------- appearance ---------- */
const FONTS=['Cormorant Garamond','Playfair Display','Lora','Jost','Inter','Poppins','DM Sans'];
const shade=(h,a)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*(1-a)).toString(16).padStart(2,'0')).join('');
function look(m){const t=D.theme,c=(k,l,d)=>`<div class="f"><label>${l}</label><input type="color" data-th="${k}" value="${t[k]||d}" style="height:42px;padding:3px"></div>`,s=(k,l,d)=>`<div class="f"><label>${l}</label><select data-th="${k}">${FONTS.map(f=>`<option ${f===(t[k]||d)?'selected':''}>${f}`).join('')}</select></div>`;
 m.innerHTML=head('Appearance','Colours, fonts, announcement bar and which sections are shown')+`<div class="card" style="display:grid;gap:14px"><div class="f"><label>Announcement bar text</label><input id="ann" value="${esc(D.ann)}"></div><div class="grid2">${c('wine','Brand colour','#6e1f2e')}${c('ivory','Page background','#faf7f2')}${c('char','Text colour','#2b2622')}${c('gold','Accent colour','#b9975b')}${s('fh','Heading font','Cormorant Garamond')}${s('fb','Body font','Jost')}<div class="f"><label>Button / card corner radius (px)</label><input type="number" min="0" max="30" data-th="r" value="${t.r??4}"></div></div><button class="btn g s" id="rt" style="width:max-content">Reset appearance to original</button></div>
 <div class="card"><h3>Website sections</h3><p style="color:var(--mut);margin:6px 0 12px">Untick a section to remove it from the homepage.</p><div class="grid2">${SECS.map(([id,l])=>`<label class="sw"><input type="checkbox" data-sec="${id}" ${D.hidden.includes(id)?'':'checked'}> ${l}</label>`).join('')}</div></div>`;
 m.onchange=e=>{const t2=e.target;if(t2.id==='ann'){D.ann=t2.value;touch('Edited announcement')}if(t2.dataset.th){const k=t2.dataset.th;t2.value===''?delete D.theme[k]:D.theme[k]=k==='r'?+t2.value:t2.value;if(k==='wine')D.theme['wine-d']=shade(t2.value,.25);touch('Changed appearance')}
  if(t2.dataset.sec){D.hidden=D.hidden.filter(x=>x!==t2.dataset.sec);if(!t2.checked)D.hidden.push(t2.dataset.sec);touch('Toggled section '+t2.dataset.sec)}};
 $('#rt').onclick=()=>{D.theme={};touch('Reset appearance');draw()}}
/* ---------- preview / publish ---------- */
function prev(m){const url=(()=>{try{return localStorage.getItem(SITE_URL_KEY)||''}catch(e){return ''}})();
 m.innerHTML=head('Publish','Changes stay in your draft until you publish. Publishing updates your live website through Firebase.')+`<div class="card" style="display:grid;gap:12px"><h3>Status</h3><p style="color:var(--mut)" id="pst">${dirty()?'You have unpublished changes.':'Everything is published.'}</p><div class="row"><button class="btn w" id="pub">Publish changes</button><button class="btn d" id="dis">Discard changes</button></div></div>
 <div class="card" style="display:grid;gap:10px"><h3>Website preview (optional)</h3><p style="color:var(--mut)">Paste your website address to preview it here. Unpublished draft changes show with <b>?preview=1</b>.</p><input id="surl" type="url" placeholder="https://your-website.com/index.html" value="${esc(url)}"><div class="row"><button class="btn g s" id="sl">Load preview</button><button class="btn g s" data-w="1280">Desktop</button><button class="btn g s" data-w="820">Tablet</button><button class="btn g s" data-w="390">Mobile</button></div><div id="fw"></div></div>`;
 m.onclick=e=>{const w=e.target.dataset.w;if(w&&$('#fr'))$('#fr').style.width=w+'px'};
 const load=()=>{const u=$('#surl').value.trim();if(!u){alert('Enter your website address first.');return}try{localStorage.setItem(SITE_URL_KEY,u)}catch(e){}$('#fw').innerHTML='<iframe id="fr" style="width:390px" src="'+esc(u+(u.includes('?')?'&':'?')+'preview=1')+'"></iframe>'};
 $('#sl').onclick=load;
 $('#pub').onclick=async()=>{const bt=$('#pub');bt.disabled=true;bt.textContent='Publishing…';try{await fbPut(D);sv(K.site,D);log('Published changes');badge();$('#pst').textContent='Everything is published.';alert('Published! Your website now shows these changes.')}catch(e){alert('Could not publish ('+e.message+'). In Firebase Console > Realtime Database > Rules, allow writes to /site.')}bt.disabled=false;bt.textContent='Publish changes'};
 $('#dis').onclick=()=>{if(confirm('Discard all unpublished changes?')){D=normalize(JSON.parse(JSON.stringify(ld(K.site,base()))));sv(K.draft,D);log('Discarded draft');draw()}}}
/* ---------- settings ---------- */
function set(m){m.innerHTML=head('Settings','Account, backup and reset')+`<div class="card" style="display:grid;gap:8px"><h3>Signed in as</h3><p style="color:var(--mut)">${DEMO_EMAIL} (demo login)</p></div><div class="card" style="display:grid;gap:12px"><h3>Backup</h3><p style="color:var(--mut)">Export your published content as a JSON file, or import one. Importing replaces the draft.</p><div class="row"><button class="btn g" id="ex">Export JSON</button><input type="file" id="im" accept=".json" style="max-width:260px"></div></div><div class="card" style="display:grid;gap:12px"><h3>Reset</h3><p style="color:var(--mut)">Remove every admin change and go back to the original website content.</p><button class="btn d" id="rs" style="width:max-content">Reset website to original</button></div>`;
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='libaas-site.json';a.click()};
 $('#im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.products)throw 0;D=j;D.theme=D.theme||{};D.hidden=D.hidden||[];touch('Imported JSON');alert('Imported into draft. Review it in Preview, then publish.')}catch(x){alert('That file is not a valid PEHNAAVA export.')}};r.readAsText(e.target.files[0])};
 $('#rs').onclick=async()=>{if(confirm('Reset everything to the original website content? This cannot be undone.')){try{await fbDel()}catch(e){alert('Could not clear Firebase ('+e.message+').')}[K.site,K.draft].forEach(k=>localStorage.removeItem(k));log('Reset to original');location.reload()}}}
boot();
</script></body></html>
