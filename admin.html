const head=(t,s,btn='')=>`<div class="row"><div><h1 class="t">${t}</h1><p style="color:var(--mut)">${s}</p></div><div class="sp" style="flex:1"></div>${btn}</div>`;

<div class="card"><h3>Quick actions</h3><div class="row" style="margin-top:12px"><button class="btn w" data-go="prod" data-add>+ Add product</button><button class="btn g" data-go="hero">Edit banners</button><button class="btn g" data-go="look">Colours & sections</button><button class="btn g" data-go="prev">Publish</button></div></div>
<div class="card"><h3>Recent changes</h3><ul class="log" style="margin-top:12px">${l.length?l.slice(0,8).map(x=>`<li><b style="color:var(--ink)">${esc(x.m)}</b> · ${esc(x.t)}</li>`).join(''):'<li>No changes yet.</li>'}</ul></div>`;
 m.onclick=e=>{const b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;draw();if(b.hasAttribute('data-add'))pf()}}}

function prod(m){const list=D.products.map((p,i)=>[p,i]).filter(([p])=>!q||(p.name+p.cat+(p.badge||'')).toLowerCase().includes(q));
 m.innerHTML=head('Products',D.products.length+' products · edit, hide, reorder or delete','<button class="btn w" id="addp">+ Add product</button>')+`<div class="wrapx"><table><tr><th>ID</th><th></th><th>Name</th><th>Category</th><th>Price</th><th>Badge</th><th>Visible</th><th></th></tr>${list.map(([p,i])=>`<tr><td style="color:var(--mut)">${p.id}</td><td><img src="${esc(p.img)}" alt=""></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>₹${p.price} <s style="color:var(--mut)">₹${p.mrp}</s></td><td>${esc(p.badge||'—')}</td><td><input type="checkbox" style="width:auto" data-vis="${i}" ${p.hidden?'':'checked'}></td><td class="row" style="flex-wrap:nowrap"><button class="btn g s" data-mv="${i}|-1">↑</button><button class="btn g s" data-mv="${i}|1">↓</button><button class="btn g s" data-ed="${i}">Edit</button><button class="btn d s" data-del="${i}">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No products found.</td></tr>'}</table></div>`;
 $('#addp').onclick=()=>pf();
 m.onclick=e=>{const t=e.target;if(t.dataset.ed!=null)pf(+t.dataset.ed);if(t.dataset.del!=null){const p=D.products[+t.dataset.del];if(confirm('Delete “'+p.name+'”? It will disappear from the website after you publish.')){D.products.splice(+t.dataset.del,1);touch('Deleted product '+p.name);draw()}}
  if(t.dataset.mv){const[a,d]=t.dataset.mv.split('|').map(Number),b=a+d;if(b>=0&&b<D.products.length){[D.products[a],D.products[b]]=[D.products[b],D.products[a]];touch('Reordered products');draw()}}
  if(t.dataset.vis!=null){const p=D.products[+t.dataset.vis];p.hidden=!t.checked;touch((p.hidden?'Hid ':'Showed ')+p.name)}}}
function pf(i){const n=i==null,p=n?{id:Math.max(0,...D.products.map(x=>x.id))+1,name:'',cat:D.cats[0]?D.cats[0][0]:'Kurta Sets',tags:['Casual'],price:999,mrp:1499,rating:4.5,count:0,badge:'New',colors:[['Ivory','#f1e9dc']],img:'',alt:'',gallery:[],fabric:'',care:'',desc:''}:{...D.products[i]};
 const f=(id,l,v,t='text')=>`<div class="f"><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
 const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h2>${n?'Add product':'Edit product'}</h2><div class="grid2">${f('f_name','Name',p.name)}<div class="f"><label>Category</label><input id="f_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(D.products.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div>${f('f_price','Sale price (₹)',p.price,'number')}${f('f_mrp','MRP (₹)',p.mrp,'number')}${f('f_badge','Badge (New, Bestseller, blank for none)',p.badge||'')}${f('f_tags','Tags (comma separated)',p.tags.join(', '))}</div>
 ${f('f_img','Main image URL',p.img)}${f('f_alt','Hover image URL',p.alt)}<div class="f"><label>More gallery images (one URL per line)</label><textarea id="f_gal">${esc((p.gallery||[]).join('\n'))}</textarea></div>${f('f_col','Colours (Name:#hex, comma separated)',p.colors.map(c=>c[0]+':'+c[1]).join(', '))}${f('f_fab','Fabric',p.fabric)}${f('f_care','Care',p.care)}<div class="f"><label>Description</label><textarea id="f_desc">${esc(p.desc)}</textarea></div><label class="sw"><input type="checkbox" id="f_vis" ${p.hidden?'':'checked'}> Visible on website</label><p id="f_err" style="color:var(--err)"></p><div class="row"><button class="btn g" id="f_x">Cancel</button><div class="sp" style="flex:1"></div><button class="btn w" id="f_ok">Save product</button></div></div>`;document.body.appendChild(bg);
 $('#f_x').onclick=()=>bg.remove();$('#f_ok').onclick=()=>{const v=id=>$('#'+id).value.trim(),price=+v('f_price'),mrp=+v('f_mrp');if(!v('f_name')||!(price>0)||!v('f_img')){$('#f_err').textContent='Name, a price above 0 and a main image URL are required.';return}
  const o={...p,name:v('f_name'),cat:v('f_cat')||'Uncategorised',price,mrp:Math.max(mrp,price),badge:v('f_badge')||null,tags:v('f_tags').split(',').map(s=>s.trim()).filter(Boolean),img:v('f_img'),alt:v('f_alt')||v('f_img'),gallery:[v('f_img'),...$('#f_gal').value.split('\n').map(s=>s.trim()).filter(Boolean)],colors:v('f_col').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split(':');return[a.trim(),(b||'#cccccc').trim()]}),fabric:v('f_fab'),care:v('f_care'),desc:$('#f_desc').value.trim(),hidden:!$('#f_vis').checked};if(!o.colors.length)o.colors=[['Default','#cccccc']];
  if(n)D.products.unshift(o);else D.products[i]=o;touch((n?'Added product ':'Edited product ')+o.name);bg.remove();draw()}}

 $('#addi').onclick=()=>{D[key].push(mk());touch('Added item to '+title);draw()};
 m.onchange=e=>{const t=e.target;if(t.dataset.l){const[k,i,f]=t.dataset.l.split('|');D[k][+i][f]=t.value;touch('Edited '+title)}};
 m.onclick=e=>{const t=e.target;if(t.dataset.x){const[k,i]=t.dataset.x.split('|');if(confirm('Delete this item? It disappears from the website after you publish.')){D[k].splice(+i,1);touch('Deleted item from '+title);draw()}}

 m.innerHTML=head('Appearance','Colours, fonts, announcement bar and which sections are shown')+`<div class="card" style="display:grid;gap:14px"><div class="f"><label>Announcement bar text</label><input id="ann" value="${esc(D.ann)}"></div><div class="grid2">${c('wine','Brand colour','#6e1f2e')}${c('ivory','Page background','#faf7f2')}${c('char','Text colour','#2b2622')}${c('gold','Accent colour','#b9975b')}${s('fh','Heading font','Cormorant Garamond')}${s('fb','Body font','Jost')}<div class="f"><label>Button / card corner radius (px)</label><input type="number" min="0" max="30" data-th="r" value="${t.r??4}"></div></div><button class="btn g s" id="rt" style="width:max-content">Reset appearance to original</button></div>
 <div class="card"><h3>Website sections</h3><p style="color:var(--mut);margin:6px 0 12px">Untick a section to remove it from the homepage.</p><div class="grid2">${SECS.map(([id,l])=>`<label class="sw"><input type="checkbox" data-sec="${id}" ${D.hidden.includes(id)?'':'checked'}> ${l}</label>`).join('')}</div></div>`;
 m.onchange=e=>{const t2=e.target;if(t2.id==='ann'){D.ann=t2.value;touch('Edited announcement')}if(t2.dataset.th){const k=t2.dataset.th;t2.value===''?delete D.theme[k]:D.theme[k]=k==='r'?+t2.value:t2.value;if(k==='wine')D.theme['wine-d']=shade(t2.value,.25);touch('Changed appearance')}
  if(t2.dataset.sec){D.hidden=D.hidden.filter(x=>x!==t2.dataset.sec);if(!t2.checked)D.hidden.push(t2.dataset.sec);touch('Toggled section '+t2.dataset.sec)}};

function fmtDate(s){try{const d=new Date(s);return isNaN(d)?String(s||''):d.toLocaleString()}catch(e){return String(s||'')}}

  m.innerHTML=head('Orders',list.length+' order'+(list.length===1?'':'s')+' saved online · newest first','<button class="btn w" id="ro">↻ Refresh</button>')+(list.length?'<div class="wrapx"><table><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Payment</th><th>Items</th><th>Total</th></tr>'+list.map(o=>`<tr><td style="white-space:nowrap">${esc(fmtDate(o.date))}</td><td>${esc(o.name||'—')}</td><td>${esc(o.phone||'—')}<div style="color:var(--mut);font-size:12px">${esc(o.email||'')}</div></td><td>${esc(o.method||'—')}<div style="color:var(--mut);font-size:12px">${o.testMode?'test mode':''}</div></td><td>${toArr(o.items).map(it=>esc(((it.qty||1))+'× '+(it.name||'')+(it.size?' ('+it.size+')':''))).join('<br>')}</td><td>₹${esc(o.total!=null?o.total:'?')}<div style="color:var(--mut);font-size:12px">${esc(o.id||'')}</div></td></tr>`).join('')+'</table></div>':'<div class="card">No orders yet. Orders appear here automatically after customers finish checkout on your website.</div>')}).catch(e=>{m.innerHTML=head('Orders','')+`<div class="card"><h3>Could not load orders</h3><p style="color:var(--mut)">${esc(e.message)}. Check Firebase Console → Realtime Database → Rules to allow reading /orders.</p></div>`})}

function coupTab(m){const card=(c,i)=>`<div class="item"><div class="grid2"><div class="f"><label>Code (uppercase, no spaces)</label><input data-cp="${i}|code" value="${esc(c.code||'')}"></div><div class="f"><label>Type</label><select data-cp="${i}|type">${[['pct','Percent (%) off'],['flat','Flat (₹) off'],['ship','Free shipping']].map(([t,l])=>`<option value="${t}" ${t===(c.type||'pct')?'selected':''}>${l}</option>`).join('')}</select></div><div class="f"><label>${c.type==='flat'?'Discount amount (₹)':'Discount percent (%)'}</label><input type="number" min="0" data-cp="${i}|value" value="${esc(c.type==='ship'?0:(c.value||0))}" ${c.type==='ship'?'disabled':''}></div><div class="f"><label>Minimum order (₹, 0 = none)</label><input type="number" min="0" data-cp="${i}|min" value="${esc(c.min||0)}"></div></div><div class="row"><button class="btn g s" data-m="coupons|${i}|-1">↑ Up</button><button class="btn g s" data-m="coupons|${i}|1">↓ Down</button><button class="btn d s" data-x="coupons|${i}">Delete</button></div></div>`;
 m.innerHTML=head('Coupons','Discount codes customers can apply at checkout. Changes reach the website checkout after you publish.','<button class="btn w" id="addi">+ Add coupon</button>')+(D.coupons.map((c,i)=>card(c,i)).join('')||'<div class="card">No coupons yet.</div>');
 $('#addi').onclick=()=>{D.coupons.push({code:'NEWCODE',type:'pct',value:10,min:0});touch('Added coupon');draw()};
 m.onchange=e=>{const t=e.target;if(t.dataset.cp!=null){const[i,f]=t.dataset.cp.split('|'),c=D.coupons[+i],v=t.value;if(f==='code')c.code=v.trim().toUpperCase().replace(/\s+/g,'.').replace(/\.{2,}/g,'.');else if(f==='type'){c.type=v;if(v==='ship')c.value=0;draw()}else c[f]=+v||0;touch('Edited coupons')}};

function footTab(m){const card=(g,i)=>`<div class="item"><div class="grid2"><div class="f"><label>Column heading</label><input data-ft="${i}|title" value="${esc(g.title||'')}"></div><div class="f"><label>Links — one per line (clicking one opens the website info pop-up)</label><textarea data-ft="${i}|links" placeholder="New Arrivals">${esc((g.links||[]).join('\n'))}</textarea></div></div><div class="row"><button class="btn g s" data-m="footer|${i}|-1">↑ Up</button><button class="btn g s" data-m="footer|${i}|1">↓ Down</button><button class="btn d s" data-x="footer|${i}">Delete</button></div></div>`;
 m.innerHTML=head('Footer links','Columns and links shown in the website footer.','<button class="btn w" id="addi">+ Add footer column</button>')+(D.footer.map((g,i)=>card(g,i)).join('')||'<div class="card">No footer columns yet.</div>');
 $('#addi').onclick=()=>{D.footer.push({title:'New Column',links:['New link']});touch('Added footer column');draw()};
 m.onchange=e=>{const t=e.target;if(t.dataset.ft!=null){const[i,f]=t.dataset.ft.split('|');if(f==='title')D.footer[+i].title=t.value;else D.footer[+i].links=t.value.split('\n').map(s=>s.trim()).filter(Boolean);touch('Edited footer')}};
 m.onclick=e=>{const t=e.target;if(t.dataset.x){if(confirm('Delete this footer column?')){D.footer.splice(+t.dataset.x.split('|')[1],1);touch('Deleted footer column');draw()}}
  if(t.dataset.m){const[k,i,d]=t.dataset.m.split('|'),a=+i,b=a+ +d;if(b>=0&&b<D.footer.length){[D.footer[a],D.footer[b]]=[D.footer[b],D.footer[a]];touch('Reordered footer columns');draw()}}}}
/* ---------- curated rows ---------- */
function rowsTab(m){const a=(k,l,ph)=>`<div class="f"><label>${l}</label><input data-pk="${k}" value="${esc((D.picks[k]||[]).join(', '))}" placeholder="${ph}"></div>`;
 m.innerHTML=head('Curated rows','Choose which products appear in the “Trending now”, “Shop the look” and Instagram rows of the homepage. A row with no IDs is hidden.')+`<div class="card" style="display:grid;gap:14px"><div class="grid2">${a('trending','Trending now — product IDs, comma separated','e.g. 22, 36, 41, 47')}${a('look','Shop the look row — product IDs','e.g. 16, 41, 22')}${a('insta','Instagram grid — product IDs','e.g. 41, 3, 8, 10, 13, 15')}</div><p style="color:var(--mut)">Product IDs are the numbers shown in the <b>ID</b> column of the Products tab. Categories: “Pakistani Suits” products carry IDs 41–54.</p></div>`;
 m.onchange=e=>{const t=e.target;if(t.dataset.pk){D.picks[t.dataset.pk]=t.value.split(',').map(s=>parseInt(s,10)).filter(n=>n>0);touch('Edited curated rows')}}}

function set(m){m.innerHTML=head('Settings','Account, backup and reset')+`<div class="card" style="display:grid;gap:8px"><h3>Signed in as</h3><p style="color:var(--mut)">${esc(((window.FBAUTH&&window.FBAUTH.auth.currentUser)||{}).email||'')} (Firebase Authentication)</p></div><div class="card" style="display:grid;gap:12px"><h3>WhatsApp / support number</h3><p style="color:var(--mut)">Country code + number, digits only (e.g. 919999999999). The website uses it for the floating WhatsApp button and the checkout help link — it applies after you publish.</p><div class="f"><label>Number</label><input id="wa" inputmode="numeric" placeholder="919999999999" value="${esc(D.wa)}"></div></div><div class="card" style="display:grid;gap:12px"><h3>Backup</h3><p style="color:var(--mut)">Export your published content as a JSON file, or import one. Importing replaces the draft.</p><div class="row"><button class="btn g" id="ex">Export JSON</button><input type="file" id="im" accept=".json" style="max-width:260px"></div></div><div class="card" style="display:grid;gap:12px"><h3>Reset</h3><p style="color:var(--mut)">Remove every admin change and go back to the original website content.</p><button class="btn d" id="rs" style="width:max-content">Reset website to original</button></div>`;
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='libaas-site.json';a.click()};
 $('#wa').onchange=e=>{D.wa=e.target.value.replace(/\D/g,'');touch('Changed WhatsApp number')};
 $('#im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.products)throw 0;D=j;D.theme=D.theme||{};D.hidden=D.hidden||[];touch('Imported JSON');alert('Imported into draft. Review it in Preview, then publish.')}catch(x){alert('That file is not a valid PEHNAAVA export.')}};r.readAsText(e.target.files[0])};
 $('#rs').onclick=async()=>{if(confirm('Reset everything to the original website content? This cannot be undone.')){try{await fbDel()}catch(e){alert('Could not clear Firebase ('+e.message+').')}[K.site,K.draft].forEach(k=>localStorage.removeItem(k));log('Reset to original');location.reload()}}}
boot();
